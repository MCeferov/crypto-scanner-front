# Netlify hosts this SPA only. The API is a separate service on Railway at
# https://crypto-scanner-back-production.up.railway.app — that origin is the
# build's default, so no env var is needed. To target a different backend set
# VITE_API_URL (Site settings → Environment variables); it is read at BUILD
# time and baked into the bundle, so changing it requires a redeploy, not just
# a restart.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # --prod=false is defensive: Netlify may set NODE_ENV=production, and the
  # build toolchain (vite, tailwind, typescript) lives in devDependencies.
  PNPM_FLAGS = "--frozen-lockfile --prod=false"

# SPA fallback. Without this, any path other than / is a Netlify 404 because
# no file exists on disk for it — wouter routes client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite fingerprints these filenames, so they can never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached or clients keep booting an old bundle.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# ─── Security headers (all routes) ────────────────────────────────
# These are defence-in-depth for a HOSTILE-client SPA. They do not and
# cannot protect data the browser already holds — real authorization lives
# on the Railway API. They shrink the attack surface: clickjacking, MIME
# sniffing, referrer leakage, and the blast radius of any injected script.
#
# The Content-Security-Policy is an ALLOWLIST — every external origin the app
# talks to must appear in connect-src, or the browser silently blocks it:
#   • the Railway API (REST + SSE)      → default backend below
#   • Binance market WebSocket          → wss://stream.binance.com:9443
#   • Fear & Greed index                → https://api.alternative.me
#   • Google Fonts CSS / font files     → fonts.googleapis.com / fonts.gstatic.com
#
# IMPORTANT: if you point VITE_API_URL at a different backend, add that exact
# origin to connect-src here too — otherwise every API call fails in prod with
# no visible error. style-src needs 'unsafe-inline' because the charting
# library injects a runtime <style> element; script-src stays locked to 'self'
# (the bundle ships no inline scripts).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' https://crypto-scanner-back-production.up.railway.app wss://stream.binance.com:9443 https://api.alternative.me; upgrade-insecure-requests"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), fullscreen=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
